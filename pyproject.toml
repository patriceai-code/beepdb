[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beepdb"
version = "0.2.0"
description = "Open Database of Hardware Acoustic Signatures & Diagnostic Beep Codes"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Patrice Deloffre-Zachelin", email = "zachelin.pat@gmail.com" }
]
keywords = ["iot", "acoustics", "smart-home", "audio", "diagnostics", "hardware", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Topic :: Scientific/Engineering :: Information Analysis"
]

[project.scripts]
beepdb = "beepdb.cli:main"

[tool.setuptools.package-data]
beepdb = ["*.csv", "*.md"]
